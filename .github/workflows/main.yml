name: Render Keep Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render's 15-minute sleep timer
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CineMatch Backend
        run: |
          curl -s --max-time 15 https://cinematch-ai-recommender.onrender.com/ping || true