name: Render Keep Alive

on:
  schedule:
    # Runs every 10 minutes to prevent sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CineMatch Backend
        run: |
          curl -s --max-time 15 https://movie-recommender-system-vj3w.onrender.com/ping || true
